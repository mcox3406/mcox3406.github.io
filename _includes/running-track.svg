<svg class="fun-track" viewBox="0 0 660 280" fill="none" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <defs>
    <pattern id="running-track-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" class="fun-track-grid"/>
    </pattern>
    <pattern id="running-track-grass" width="48" height="280" patternUnits="userSpaceOnUse">
      <path d="M0 0H24V280H0Z" fill="currentColor" opacity=".045"/>
    </pattern>
  </defs>
  <path d="M0 0H660V280H0Z" fill="url(#running-track-grid)"/>

  <!-- Concentric stadium curves keep every lane continuous and evenly spaced. -->
  <rect class="fun-track-surround" x="87" y="21" width="486" height="238" rx="119"/>
  <rect class="fun-track-surface" x="94" y="28" width="472" height="224" rx="112"/>
  <g class="fun-track-alternate" stroke-width="5">
    <rect x="96.5" y="30.5" width="467" height="219" rx="109.5"/>
    <rect x="106.5" y="40.5" width="447" height="199" rx="99.5"/>
    <rect x="116.5" y="50.5" width="427" height="179" rx="89.5"/>
    <rect x="126.5" y="60.5" width="407" height="159" rx="79.5"/>
  </g>
  <rect class="fun-track-infield" x="134" y="68" width="392" height="144" rx="72"/>
  <rect x="134" y="68" width="392" height="144" rx="72" fill="url(#running-track-grass)"/>
  <g class="fun-track-lanes" stroke-width=".8">
    <rect x="94" y="28" width="472" height="224" rx="112"/>
    <rect x="99" y="33" width="462" height="214" rx="107"/>
    <rect x="104" y="38" width="452" height="204" rx="102"/>
    <rect x="109" y="43" width="442" height="194" rx="97"/>
    <rect x="114" y="48" width="432" height="184" rx="92"/>
    <rect x="119" y="53" width="422" height="174" rx="87"/>
    <rect x="124" y="58" width="412" height="164" rx="82"/>
    <rect x="129" y="63" width="402" height="154" rx="77"/>
    <rect x="134" y="68" width="392" height="144" rx="72"/>
  </g>

  <!-- Common finish on the home straight; staggered starts on the first bend. -->
  <path class="fun-track-lanes" d="M454 212V252" stroke-width="1.5"/>
  <g class="fun-track-lanes" stroke-width="1.1">
    <path d="M454 212V217"/>
    <path d="M483.64 211.07l1.92 4.61"/>
    <path d="M509.51 200.36l3.38 3.68"/>
    <path d="M529.60 183.06l4.34 2.47"/>
    <path d="M543.34 161.96l4.86 1.19"/>
    <path d="M551 139.23l5-.04"/>
    <path d="M553.24 116.45l4.86-1.15"/>
    <path d="M550.92 94.66l4.53-2.12"/>
  </g>
  <!-- Painted digits face the running direction. Paths avoid font/baseline drift;
       lane 1 is nearest the infield, with one centered digit per lane. -->
  <g class="fun-track-numbers" stroke-width=".65" stroke-linecap="round" stroke-linejoin="round">
    <path transform="translate(442 214.5) rotate(90)" d="M-1.5-1.5 0-3V3M-1.5 3h3"/>
    <path transform="translate(442 219.5) rotate(90)" d="M-1.5-2c0-1.5 3-1.5 3 0 0 2-3 3-3 5h3"/>
    <path transform="translate(442 224.5) rotate(90)" d="M-1.5-3H0c2 0 2 3 0 3h-1 1c2 0 2 3 0 3h-1.5"/>
    <path transform="translate(442 229.5) rotate(90)" d="M1-3-1.5 1h3M1-3V3"/>
    <path transform="translate(442 234.5) rotate(90)" d="M1.5-3h-3v3H0c2 0 2 3 0 3h-1.5"/>
    <path transform="translate(442 239.5) rotate(90)" d="M1.5-3H0c-1 0-1.5 1-1.5 2v2.5c0 2 3 2 3 0s-3-2-3 0"/>
    <path transform="translate(442 244.5) rotate(90)" d="M-1.5-3h3L-1 3"/>
    <path transform="translate(442 249.5) rotate(90)" d="M0 0c-2 0-2-3 0-3s2 3 0 3c-2 0-2 3 0 3s2-3 0-3Z"/>
  </g>
  <g class="fun-track-detail" stroke-width=".8">
    <path d="M286 198h32m-5-3 5 3-5 3M374 82h-32m5-3-5 3 5 3"/>
    <path d="M206 134v12m-6-6h12M454 134v12m-6-6h12" opacity=".45"/>
    <path d="M454 258v12h37"/>
  </g>
  <text class="fun-track-caption" x="499" y="273">START / FINISH</text>
  <text class="fun-track-index" x="20" y="265">01 / RUNNING</text>
</svg>
