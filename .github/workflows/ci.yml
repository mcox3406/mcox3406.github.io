name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/milepost*.test.js
      - run: bundle exec jekyll build

  running-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/running-sync/package-lock.json
      - run: npm ci
        working-directory: services/running-sync
      - run: npm run test:runtime
        working-directory: services/running-sync
        env:
          WRANGLER_SEND_METRICS: "false"
