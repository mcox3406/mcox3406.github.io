<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body>
  {% if page.layout == 'home' %}

    {% include molecular-landscape.svg %}
  </div>

  <div class="layout">
    {% include sidebar.html %}
    <main id="main">
      {{ content }}
    </main>
  </div>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
